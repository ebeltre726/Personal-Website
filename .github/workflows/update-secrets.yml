name: Update SSM Secrets

on:
  workflow_dispatch:
    inputs:
      parameter_name:
        description: 'SSM parameter name to update'
        required: true
        default: '/portfolio/emailjs/private-key'

permissions:
  id-token: write
  contents: read

jobs:
  update-ssm-secret:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      PARAMETER_NAME: ${{ github.event.inputs.parameter_name }}
      # GitHub Actions secret that will be written into SSM Parameter Store.
      SECRET_VALUE: ${{ secrets.EMAILJS_PRIVATE_KEY }}

    steps:
      # Check out the repository so the workflow can run locally from the repo context.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to AWS with the same OIDC-based role assumption used by deployment.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PORTFOLIO_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Fail early if the workflow is missing the required parameter name or secret value.
      - name: Validate required inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PARAMETER_NAME}" ]]; then
            echo "Parameter name is required." >&2
            exit 1
          fi
          if [[ -z "${SECRET_VALUE}" ]]; then
            echo "The EMAILJS_PRIVATE_KEY repository secret is empty or not configured." >&2
            exit 1
          fi

      # Write the secret into SSM Parameter Store as an overwrite-safe SecureString.
      - name: Update SSM SecureString parameter
        shell: bash
        run: |
          set -euo pipefail
          echo "Updating SSM parameter: ${PARAMETER_NAME}"
          aws ssm put-parameter \
            --name "${PARAMETER_NAME}" \
            --value "${SECRET_VALUE}" \
            --type "SecureString" \
            --overwrite
