name: Terraform Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}

      TF_VAR_emailjs_service_id: ${{ vars.EMAILJS_SERVICE_ID }}
      TF_VAR_emailjs_template_id: ${{ vars.EMAILJS_TEMPLATE_ID }}
      TF_VAR_emailjs_public_key: ${{ vars.EMAILJS_PUBLIC_KEY }}
      TF_VAR_emailjs_private_key: ${{ secrets.EMAILJS_PRIVATE_KEY }}
      TF_VAR_allowed_origins: ${{ vars.ALLOWED_ORIGINS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Format Check
        working-directory: infrastructure/app
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infrastructure/app
        run: terraform init -reconfigure

      - name: Terraform Validate
        working-directory: infrastructure/app
        run: terraform validate

      - name: Terraform Plan
        working-directory: infrastructure/app
        run: terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: infrastructure/app
        run: terraform apply -auto-approve
