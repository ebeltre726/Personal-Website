    <section id="contact">
        <h1>Contact Me</h1>
        <form id="contactForm">
            <label for="first" class="sr-only">First Name</label>
            <input id="first" type="text" name="first" placeholder="First Name" autocomplete="given-name" required>

            <label for="last" class="sr-only">Last Name</label>
            <input id="last" type="text" name="last" placeholder="Last Name" autocomplete="family-name" required>

            <label for="email" class="sr-only">Email Address</label>
            <input id="email" type="email" name="email" placeholder="Email Address" autocomplete="email" required>

            <label for="message" class="sr-only">Message</label>
            <textarea id="message" rows="5" name="message" placeholder="Enter your message" autocomplete="off" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </section>
